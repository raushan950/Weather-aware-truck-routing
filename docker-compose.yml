services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
